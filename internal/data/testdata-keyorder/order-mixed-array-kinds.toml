# The same key path is a [[table]] array in one element and an inline
# array in another. MetaData keeps one type per path, so a loader can't
# tell the two apart by type alone.

# aot: [[aot.x]] tables in the first element, an inline array in the
# second. Each [[aot.x]] table keeps its own order.
[[aot]]
[[aot.x]]
z = 1
a = 2

[[aot.x]]
z = 3
a = 4

[[aot]]
x = []

# mix: one [[mix.x]] table in the first element, an inline array of
# tables in the second. Each table in it keeps its own order.
[[mix]]
[[mix.x]]
z = 1
a = 2

[[mix]]
x = [{b = 1, a = 2}, {a = 3, b = 4}]

# rev: the reverse of mix. An inline array of tables in the first
# element, one [[rev.x]] table in the second (issue #1434).
[[rev]]
x = [{b = 1, a = 2}, {a = 3, b = 4}]

[[rev]]
[[rev.x]]
z = 1
a = 2

# revtwo: inline arrays in two elements, then a [[revtwo.x]] table.
[[revtwo]]
x = [{b = 1, a = 2}]

[[revtwo]]
x = [{d = 1, c = 2}, {c = 3, d = 4}]

[[revtwo]]
[[revtwo.x]]
z = 1
a = 2

# between: an inline array in an element between two that write
# [[between.x]] tables.
[[between]]
[[between.x]]
z = 1
a = 2

[[between]]
x = [{b = 1, a = 2}, {a = 3, b = 4}]

[[between]]
[[between.x]]
y = 1
c = 2

# revempty: an empty inline array, then a [[revempty.x]] table.
[[revempty]]
x = []

[[revempty]]
[[revempty.x]]
z = 1
a = 2
