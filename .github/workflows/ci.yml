name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.github/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - '.github/*.md'
  schedule:
    # Weekly, so new advisories are caught in code that hasn't changed.
    - cron: '17 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Keep in step with release.yml so CI tests the Go that ships.
          go-version: '1.26'
          check-latest: true
      - run: go test -race ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Keep in step with release.yml: standard library fixes ship in
          # Go patch releases, so check the Go the release is built with.
          go-version: '1.26'
          check-latest: true
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
